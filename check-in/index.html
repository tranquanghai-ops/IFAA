<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quét điểm danh · IFA+A</title><link rel="stylesheet" href="../attendance.css?v=1"></head><body><main class="att-shell scanner-box"><header class="att-head"><div><h1>Điểm danh IFA+A</h1><p id="account"></p></div><div class="att-actions"><a class="att-btn" href="../">Trang sự kiện</a><button id="loginBtn" class="att-btn primary">Đăng nhập TDTU</button><button id="logoutBtn" class="att-btn hidden">Đăng xuất</button></div></header><div id="notice" class="att-notice hidden"></div><section id="app" class="att-card hidden"><h2 id="title">Sự kiện</h2><p id="meta" class="att-meta"></p><div id="closedMessage" class="scanner-message hidden"><h2>Sự kiện đã kết thúc.</h2><p>Cảm ơn bạn đã đồng hành.</p></div><div id="scannerArea"><p id="roleText" class="att-meta"></p>
<div id="scanStatus" class="scan-status"><b>Sẵn sàng điểm danh</b><span>Nhấn “Bắt đầu quét” để mở camera sau.</span></div>
<section class="camera-card">
  <div class="scanner-video-wrap"><video id="video" autoplay playsinline webkit-playsinline muted></video><div class="scanner-frame"></div><div class="scanner-tip">Đưa mã vạch trên thẻ sinh viên vào khung</div></div>
  <div class="scanner-controls"><button id="startCamera" class="att-btn green" type="button">▶ Bắt đầu quét</button><button id="stopCamera" class="att-btn" type="button" disabled>■ Dừng</button><button id="capturePhoto" class="att-btn photo" type="button">📷 Chụp hình</button></div>
  <label class="camera-select-label">Camera sau<select id="cameraSelect"><option value="">Tự động chọn camera sau</option></select></label>
</section>
<form id="scanForm" class="att-form manual-scan-form" style="grid-template-columns:1fr auto"><input id="mssv" class="scan-input" autocomplete="off" autocapitalize="characters" placeholder="Nhập MSSV thủ công" required><button class="att-btn green">Điểm danh</button></form>
<div id="photoPreviewBox" class="photo-preview-box hidden"><img id="photoPreview" alt="Hình vừa chụp"><div><b>Đã chụp hình</b><p>Nhập MSSV bên trên rồi bấm Điểm danh để lưu kèm hình.</p><button id="discardPhoto" class="att-btn" type="button">Bỏ hình</button></div></div>
<table class="att-table"><thead><tr><th>MSSV</th><th>Họ tên</th><th>Thời gian</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script type="module" src="./check-in.mjs?v=2"></script></body></html>
