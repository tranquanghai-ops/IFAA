name: Deploy IFA+ Activities to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Firebase Rules and clients
        run: |
          pnpm install --frozen-lockfile
          pnpm test:syntax
          pnpm test:security-static
          pnpm test:rules

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IFAA }}

      - name: Deploy Firestore Rules and indexes
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project ifa-activities --non-interactive

      - name: Deploy Storage Rules
        run: npx --yes firebase-tools@latest deploy --only storage:facultyDataset --project ifa-activities --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IFAA }}
          channelId: live
          projectId: ifa-activities
